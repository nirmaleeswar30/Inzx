name: Desktop build

# Builds the Windows and Linux apps. The ENV_FILE repository secret holds the
# contents of .env; without it the apps build, but Jams and sign-ins that read
# keys from .env won't work.
on:
  push:
    branches: [feat/desktop-port]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv \
            libmimalloc-dev libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Write .env
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - run: flutter build linux --release
      - name: Package
        run: tar -czf inzx-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: inzx-linux-x64
          path: inzx-linux-x64.tar.gz

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Write .env
        shell: bash
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: inzx-windows-x64
          path: build/windows/x64/runner/Release/

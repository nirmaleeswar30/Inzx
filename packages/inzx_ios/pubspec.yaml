name: inzx_ios
description: "Inzx's iOS-only native side: the audio tap (equaliser, AutoEQ,
  loudness), audio route, folder access, widget bridge and Automix's native
  library. iOS only, so it adds nothing to the Android build."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.10.3
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: InzxIosPlugin

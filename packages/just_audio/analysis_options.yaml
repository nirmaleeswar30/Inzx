include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    # Upstream's own notes (ryanheise/just_audio), kept so the fork diffs
    # cleanly against upstream; they aren't work for this app.
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: false
    unawaited_futures: false

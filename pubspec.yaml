name: inzx
description: "Inzx - A beautiful and sleek music player with YouTube Music integration and Jams."
publish_to: 'none'
version: 1.5.8+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  # Desktop Automix's native bindings (pure Dart, already in the lock).
  ffi: ^2.1.4
  flutter_secure_storage: ^9.2.4

  # UI & Animations
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2
  video_player_win: ^3.3.1 # Windows backend for canvases (Windows-only plugin, no Android code)
  marquee: ^2.3.0
  skeletonizer: ^2.1.3

  # Icons
  iconsax: ^0.0.8
  flutter_svg: ^2.0.10+1 # Inline vector brand marks (e.g. Discord logo)

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Location & Weather
  http: ^1.2.2

  # Music Player
  just_audio: ^0.9.42 # Audio playback
  audio_service: ^0.18.15 # Background playback & media controls
  audio_session: ^0.1.21 # Audio focus management
  palette_generator: ^0.3.3+4 # Extract colors from album art
  rxdart: ^0.28.0 # Reactive streams for audio

  # YouTube Music InnerTube API
  crypto: ^3.0.6 # For SAPISIDHASH generation
  pointycastle: ^4.0.0 # For JioSaavn DES URL decryption
  webview_flutter: ^4.14.1 # For YT Music login (4.14.1+ enables WebAuthn/passkeys on Android)
  webview_flutter_android: ^4.14.1 # Android WebAuthn/passkey support for the Discord/YT login WebView
  flutter_inappwebview: ^6.1.5 # For podcast video playback (IFrame API + origin trick)
  share_plus: ^12.0.1
  share_plus_platform_interface: ^6.1.0 # SharePlatform, for the iPad share anchor
  file_picker: ^10.3.8
  permission_handler: ^12.0.1
  archive: ^4.0.2
  html: ^0.15.6
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.1.5
  image: ^4.7.2
  
  # Google Sign-In (standalone, no Firebase Auth)
  
  # Supabase for Jams (Realtime)
  supabase_flutter: ^2.8.0
  
  # Notifications
  flutter_local_notifications: ^22.3.1
  audio_metadata_reader: ^1.4.2
  flutter_dotenv: ^6.0.0
  shorebird_code_push: ^2.0.5
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  app_links: ^7.2.0
  xml: ^6.6.1
  flutter_markdown_plus: ^1.0.12
  html_unescape: ^2.0.0

  # Desktop (Windows & Linux). None of these touch the Android build.
  just_audio_media_kit: ^2.1.0 # libmpv backend for just_audio
  media_kit: ^1.2.6 # desktop Automix's blend player (pure Dart, already in the lock)
  media_kit_libs_linux: ^1.2.1
  audio_service_mpris: ^0.2.1 # Linux media keys / desktop player widgets
  audio_service_platform_interface: ^0.1.0
  window_manager: ^0.5.0
  desktop_webview_window: ^0.4.2 # YouTube Music sign-in window
  win32: ^5.15.0 # Windows named pipes for Discord Rich Presence
  mobile_scanner: 7.2.1
  # iOS-only native side (audio tap, routes, folders, widget, Automix). An
  # iOS-only plugin, so it adds nothing to the Android build.
  inzx_ios:
    path: packages/inzx_ios
  qr_flutter: 4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Hive type adapters)
  build_runner: ^2.4.15

  # App icon and splash screen generators
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

dependency_overrides:
  # just_audio 0.9.46 plus one hook for the app's ExoPlayer renderers
  # (hi-res output, FFmpeg decoder, bit-perfect USB). See its README.
  just_audio:
    path: packages/just_audio
  # just_audio_media_kit 2.1.0 plus a hook handing the app each mpv player
  # (desktop EQ / AutoEQ / exclusive output). See its README.
  just_audio_media_kit:
    path: packages/just_audio_media_kit

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Liquid glass lens + highlight (lib/core/liquid_glass)
  shaders:
    - shaders/glass_lens.frag
    - shaders/glass_highlight.frag

  # Assets
  assets:
    - assets/icon/
    - assets/splash/
    - assets/upi.jpeg
    - assets/logo_transparent.png
    - assets/text.png
    - .env
    - shorebird.yaml
    - assets/fonts/poppins/OFL.txt

  # Desktop only: see desktopFontFamily in platform_utils.dart.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo_dark.png"
  adaptive_icon_background: "#000000"  # Sleek pitch black dark theme background
  adaptive_icon_foreground: "assets/icon/logo_dark.png"
  
# Flutter Native Splash configuration
flutter_native_splash:
  color: "#000000"  # Black background for splash screen
  image: "assets/splash/logo_splash.png"  # Padded logo asset so headphones don't clip
  android: true
  ios: false
  
  # Android specific
  android_12:
    image: "assets/splash/logo_splash.png"
    color: "#000000"
  
  # Web support (optional)
  web: false
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

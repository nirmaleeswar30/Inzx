name: inzx
description: "Inzx - A beautiful music player with YouTube Music integration and Jams."
publish_to: 'none'
version: 1.5.4

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4

  # UI & Animations
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2
  marquee: ^2.3.0
  skeletonizer: ^2.1.3

  # Icons
  iconsax: ^0.0.8

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Location & Weather
  http: ^1.2.2

  # Music Player
  just_audio: ^0.9.42 # Audio playback
  audio_service: ^0.18.15 # Background playback & media controls
  audio_session: ^0.1.21 # Audio focus management
  palette_generator: ^0.3.3+4 # Extract colors from album art
  rxdart: ^0.28.0 # Reactive streams for audio

  # YouTube Music InnerTube API
  crypto: ^3.0.6 # For SAPISIDHASH generation
  pointycastle: ^4.0.0 # For JioSaavn DES URL decryption
  webview_flutter: ^4.10.0 # For YT Music login
  flutter_inappwebview: ^6.1.5 # For podcast video playback (IFrame API + origin trick)
  share_plus: ^12.0.1
  file_picker: ^10.3.8
  permission_handler: ^12.0.1
  archive: ^4.0.2
  html: ^0.15.6
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.1.5
  image: ^4.7.2
  
  # Google Sign-In (standalone, no Firebase Auth)
  google_sign_in: ^6.2.1
  
  # Supabase for Jams (Realtime)
  supabase_flutter: ^2.8.0
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  audio_metadata_reader: ^1.4.2
  flutter_dotenv: ^6.0.0
  shorebird_code_push: ^2.0.5
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  app_links: ^7.2.0
  xml: ^6.6.1
  flutter_markdown_plus: ^1.0.12
  html_unescape: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Hive type adapters)
  build_runner: ^2.4.15

  # App icon and splash screen generators
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  
  # Assets
  assets:
    - assets/icon/
    - assets/splash/
    - .env
    - shorebird.yaml

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo_transparent.png"
  adaptive_icon_background: "#000000"  # Sleek pitch black dark theme background
  adaptive_icon_foreground: "assets/icon/logo_transparent.png"
  
# Flutter Native Splash configuration
flutter_native_splash:
  color: "#000000"  # Black background for splash screen
  image: "assets/splash/logo_splash.png"  # Padded logo asset so headphones don't clip
  android: true
  ios: false
  
  # Android specific
  android_12:
    image: "assets/splash/logo_splash.png"
    color: "#000000"
  
  # Web support (optional)
  web: false
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
